name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Phase 1's migration target is Node 22 LTS. The abandoned 2012 runtime
      # deps are declared as optionalDependencies, so a missing/unpublished one
      # (e.g. websocket-server) does not fail the install.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Check for circular dependencies
        run: npm run madge

  e2e:
    name: Client build & E2E smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # playwright.config.js orchestrates both servers: it builds the client
      # (vite build) and serves dist/ via vite preview, and boots the Phase-1
      # game/WebSocket server. The smoke test asserts the game connects, reaches
      # the "started" state, and renders pixels — failing on any console/page
      # error.
      - name: Run E2E smoke test
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
