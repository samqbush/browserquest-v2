name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Phase 1's migration target is Node 22 LTS. The abandoned 2012 runtime
      # deps are declared as optionalDependencies, so a missing/unpublished one
      # (e.g. websocket-server) does not fail the install.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
